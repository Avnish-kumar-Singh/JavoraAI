services:
  ollama:
    image: ollama/ollama:latest
    container_name: javamentor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: javamentor-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-javoraai}
      POSTGRES_USER: ${POSTGRES_USER:-javora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-javora_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: javamentor-api
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-javora_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-javoraai}
    ports:
      - "8000:8000"
    volumes:
      - ./data/knowledge:/app/data/knowledge
      - chroma_data:/app/data/chroma_db
    restart: unless-stopped

volumes:
  ollama_data:
  db_data:
  chroma_data:
